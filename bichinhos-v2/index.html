<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bichinhos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=9" />
  </head>
  <body>
    <!-- Tela inicial: garante o gesto que libera o áudio em qualquer navegador/celular -->
    <div id="start-overlay">
      <div class="start-card">
        <div class="start-emoji">🐾🔊</div>
        <p class="start-text">Toque para começar</p>
      </div>
    </div>

    <header id="title-bar">
      <h1 class="game-title" aria-label="Bichinhos Sonoros">
        <span class="line line-1" aria-hidden="true">
          <span>B</span><span>I</span><span>C</span><span>H</span><span>I</span><span>N</span><span>H</span><span>O</span><span>S</span>
        </span>
        <span class="line line-2" aria-hidden="true">
          <span>S</span><span>O</span><span>N</span><span>O</span><span>R</span><span>O</span><span>S</span>
        </span>
      </h1>
    </header>

    <main id="stage">
      <div id="dog-container"   class="animal-container"></div>
      <div id="cat-container"   class="animal-container"></div>
      <div id="horse-container" class="animal-container"></div>
      <div id="bird-container"  class="animal-container"></div>
      <div id="wolf-container"  class="animal-container"></div>
    </main>

    <script src="vendor/howler.min.js"></script>
    <script src="script.js?v=9"></script>
  </body>
</html>
